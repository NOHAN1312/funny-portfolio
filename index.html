<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>জোড়াতালি ইঞ্জিনিয়ারিং</title>

    <!-- Swarm Rebuild (website edition), step 1: hide the page until the swarm's blank canvas
         covers it, so the finished page never flashes. Failsafe: show it anyway after 5s. -->
    <script>
      (function () {
        var s = document.createElement("style");
        s.id = "swarm-preload";
        s.textContent = "body{visibility:hidden!important}";
        document.head.appendChild(s);
        window.__swarmHidden = true;
        window.__swarmUnhide = function () { var e = document.getElementById("swarm-preload"); if (e) e.remove(); };
        addEventListener("load", function () {
          setTimeout(function () { if (window.__swarmHidden) { window.__swarmHidden = false; window.__swarmUnhide(); } }, 5000);
        });
      })();

      window.SwarmRebuildConfig = {
        // finish the .reveal scroll animations instantly so every section is snapshotted fully visible
        beforeCapture: function () {
          var els = document.querySelectorAll(".reveal");
          els.forEach(function (el) { el.style.transition = "none"; el.classList.add("active"); });
          return new Promise(function (r) {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                els.forEach(function (el) { el.style.transition = ""; });
                r();
              });
            });
          });
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Swarm Rebuild, step 2: the engine (public/swarm-website.js). Options: see the file header.
         Runs on both desktop (1x speed, up to 48 agents) and mobile (auto-scaled to 2x speed,
         6-14 agents for smooth phone GPU performance). -->
    <script src="./swarm-website.js" data-delay="300" data-mobile="true"></script>
  </body>
</html>
